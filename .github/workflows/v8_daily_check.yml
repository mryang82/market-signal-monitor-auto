name: v8 Signal Check

on:
  schedule:
    # 평일 KST 07:17 메인 + 07:47 백업 (장 마감 후)
    - cron: '17 22 * * 1-5'  # KST 07:17
    - cron: '47 22 * * 1-5'  # KST 07:47 백업
    # 평일 KST 22:17 — 아침 실행 누락 대비 백업 (실제로는 4~6시간 늦게 돌아 대부분 뉴욕 장중.
    #   v14.3부터 장중 봉은 제외하고 전일 종가로 판정. 22:47 백업은 2026-10-29 제거)
    - cron: '17 13 * * 1-5'  # KST 22:17
  workflow_dispatch:

# 실행이 겹치면 같은 알림이 두 번 가고 두 번째 push가 실패해 상태가 사라짐 → 순서대로 실행 (2026-11-03)
concurrency:
  group: v8-signal
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run v8 signal check
        id: run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python auto_signal_v8.py
      
      - name: Verify data.json
        run: |
          if [ ! -f data.json ]; then
            echo "❌ data.json 생성 안 됨!"
            exit 1
          fi
          echo "✓ data.json 존재 확인"
          python -c "import json; d=json.load(open('data.json')); print(f\"timestamp: {d.get('timestamp','N/A')}\"); print(f\"fg: {d.get('fg','N/A')}\"); print(f\"level: {d.get('level','N/A')}\")"
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Signal Bot"
          
          git add data.json previous_signal.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "변경 사항 없음 — commit 생략 (백업 cron 정상 동작)"
          else
            git commit -m "📊 v8 Signal update $(date -u +%Y-%m-%dT%H:%MZ)"
            # 그사이 다른 커밋(코드 배포 등)이 있으면 그 위로 올려서 push. 봇 파일 충돌 시 이번 실행 값 우선
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin main && { echo "✓ Push 완료"; exit 0; }
              echo "push 재시도 $i"; sleep 5
            done
            echo "❌ push 실패"; exit 1
          fi

      - name: Notify job failure
        # 스크립트 자체 실패는 스크립트가 이미 텔레그램을 보냄 → 그 밖의 단계 실패(설치·push 등)만 알림
        if: failure() && steps.run.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 장기 v8 Actions 작업 실패 — 앱 장기 신호가 갱신되지 않았을 수 있음. GitHub Actions 로그 확인 필요 (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
